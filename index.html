    <script>
    // PWA Install Logic
let deferredPrompt;
const installAppBtn = document.getElementById('installAppBtn');

// 1. Listen for the beforeinstallprompt event
window.addEventListener('beforeinstallprompt', (e) => {
    // Prevent the mini-infobar from appearing on mobile
    e.preventDefault();
    // Stash the event so it can be triggered later.
    deferredPrompt = e;
    // Show the install button
    installAppBtn.style.display = 'flex';
});

// 2. Handle install button click
installAppBtn.addEventListener('click', async () => {
    if (deferredPrompt !== null) {
        // Show the native browser install prompt
        deferredPrompt.prompt();
        // Wait for the user to respond
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
            console.log('User accepted the PWA prompt');
        }
        // Clear the prompt variable
        deferredPrompt = null;
        // Hide the button since they interacted with the prompt
        installAppBtn.style.display = 'none';
    }
});

// 3. Hide button if successfully installed
window.addEventListener('appinstalled', () => {
    installAppBtn.style.display = 'none';
    deferredPrompt = null;
    console.log('PWA was installed successfully');
});
    </script>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if(tabName === 'adjust') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-adjust').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-pages').classList.add('active');
            }
        }

        let cvReady = false;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let img = new Image();
        let originalImageSrc = ''; 
        let points = [];
        let draggingPoint = null;
        let isCropped = false;
        let isBlackAndWhite = false;
        let pdfPages = [];

        const cropBtn = document.getElementById('cropBtn');
        const resetBtn = document.getElementById('resetBtn');
        const bwBtn = document.getElementById('bwBtn');
        const addPageBtn = document.getElementById('addPageBtn');
        const downloadCurrentJpgBtn = document.getElementById('downloadCurrentJpg');
        const downloadPdfBtn = document.getElementById('downloadPdfBtn');
        const brightnessSlider = document.getElementById('brightness');
        const contrastSlider = document.getElementById('contrast');
        const thumbnailList = document.getElementById('thumbnailList');
        const pageCountTxt = document.getElementById('pageCount');
        const emptyGallery = document.getElementById('emptyGallery');

        const pointRadius = 14; 
        const strokeColor = '#6366f1'; 
        const A4_RATIO = 1.4142; 

        function onOpenCvReady() {
            cvReady = true;
            document.getElementById('loading').style.display = 'none';
        }

        function loadImageData(src) {
            img.onload = () => {
                const MAX_WIDTH = 800;
                const MAX_HEIGHT = MAX_WIDTH * A4_RATIO;
                let scale = Math.min(MAX_WIDTH / img.width, MAX_HEIGHT / img.height);
                if (scale > 1) scale = 1; 

                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                
                isCropped = false;
                isBlackAndWhite = false;
                resetFilters();
                initPoints();
                draw(true); 
                
                enableButtons(true);
                addPageBtn.disabled = true;
                switchTab('adjust'); 
            }
            img.src = src;
        }

        document.getElementById('uploadInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                originalImageSrc = event.target.result;
                loadImageData(originalImageSrc);
                e.target.value = ''; 
            }
            reader.readAsDataURL(file);
        });

        function enableButtons(enable) {
            cropBtn.disabled = !enable;
            resetBtn.disabled = !enable;
            bwBtn.disabled = !enable;
            downloadCurrentJpgBtn.disabled = !enable;
        }

        function initPoints() {
            const w = canvas.width;
            const h = canvas.height;
            const offset = 40; 
            points = [
                { x: offset, y: offset },             
                { x: w - offset, y: offset },         
                { x: w - offset, y: h - offset },     
                { x: offset, y: h - offset }          
            ];
        }

       function draw(showUI = true) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const br = brightnessSlider.value;
            const ct = contrastSlider.value;
            const bw = isBlackAndWhite ? 'grayscale(100%)' : '';
            
            ctx.filter = `brightness(${100 + parseInt(br)}%) contrast(${100 + parseInt(ct)}%) ${bw}`;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            ctx.filter = 'none'; 

            if (!isCropped && showUI) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.beginPath();
                ctx.moveTo(0, 0); ctx.lineTo(canvas.width, 0); ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height); ctx.closePath();
                ctx.moveTo(points[0].x, points[0].y); ctx.lineTo(points[3].x, points[3].y); ctx.lineTo(points[2].x, points[2].y); ctx.lineTo(points[1].x, points[1].y); ctx.closePath();
                ctx.fill('evenodd');

                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for(let i=1; i<4; i++) ctx.lineTo(points[i].x, points[i].y);
                ctx.closePath();
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 2.5;
                ctx.stroke();

                points.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, pointRadius, 0, Math.PI * 2);
                    ctx.fillStyle = strokeColor;
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                });
            }
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function onPointerDown(e) {
            if(isCropped) return;
            const pos = getMousePos(e);
            draggingPoint = points.find(p => Math.hypot(p.x - pos.x, p.y - pos.y) < pointRadius * 2.5);
        }

        function onPointerMove(e) {
            if (!draggingPoint || isCropped) return;
            const pos = getMousePos(e);
            draggingPoint.x = Math.max(0, Math.min(canvas.width, pos.x));
            draggingPoint.y = Math.max(0, Math.min(canvas.height, pos.y));
            draw(true);
        }
        function onPointerUp() { draggingPoint = null; }

        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        // --- MOBILE TOUCH EVENTS FIX ---
        canvas.addEventListener('touchstart', (e) => { 
            onPointerDown(e); 
            if (draggingPoint) {
                e.preventDefault(); 
            }
        }, {passive: false});
        
        canvas.addEventListener('touchmove', (e) => { 
            if (draggingPoint) {
                e.preventDefault(); 
                onPointerMove(e); 
            }
        }, {passive: false});
        // --------------------------------

        window.addEventListener('touchend', onPointerUp);

        cropBtn.addEventListener('click', () => {
            if (!cvReady || isCropped) return;
            
            draw(false); 
            
            let src = cv.imread(canvas);
            let srcCoords = [
                points[0].x, points[0].y, points[1].x, points[1].y,
                points[2].x, points[2].y, points[3].x, points[3].y
            ];
            
            let widthA = Math.hypot(points[2].x - points[3].x, points[2].y - points[3].y);
            let widthB = Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y);
            let cropWidth = Math.max(widthA, widthB);

            let heightA = Math.hypot(points[1].x - points[2].x, points[1].y - points[2].y);
            let heightB = Math.hypot(points[0].x - points[3].x, points[0].y - points[3].y);
            let cropHeight = Math.max(heightA, heightB);

            let dstCoords = [ 0, 0, cropWidth, 0, cropWidth, cropHeight, 0, cropHeight ];
            let srcMat = cv.matFromArray(4, 1, cv.CV_32FC2, srcCoords);
            let dstMat = cv.matFromArray(4, 1, cv.CV_32FC2, dstCoords);
            let dsize = new cv.Size(cropWidth, cropHeight);
            
            let M = cv.getPerspectiveTransform(srcMat, dstMat);
            let dst = new cv.Mat();
            cv.warpPerspective(src, dst, M, dsize, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

            let tempCanvas = document.createElement('canvas');
            tempCanvas.width = cropWidth;
            tempCanvas.height = cropHeight;
            cv.imshow(tempCanvas, dst);
            
            const A4_WIDTH = 1200;
            const A4_HEIGHT = Math.round(A4_WIDTH * A4_RATIO); 

            const padding = A4_WIDTH * 0.05; 
            const maxDrawWidth = A4_WIDTH - (padding * 2);
            const maxDrawHeight = A4_HEIGHT - (padding * 2);

            let scale = Math.min(maxDrawWidth / cropWidth, maxDrawHeight / cropHeight);
            
            let drawWidth = cropWidth * scale;
            let drawHeight = cropHeight * scale;

            let offsetX = (A4_WIDTH - drawWidth) / 2;
            let offsetY = (A4_HEIGHT - drawHeight) / 2;

            canvas.width = A4_WIDTH;
            canvas.height = A4_HEIGHT;
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, A4_WIDTH, A4_HEIGHT);
            
            ctx.drawImage(tempCanvas, 0, 0, cropWidth, cropHeight, offsetX, offsetY, drawWidth, drawHeight);
            
            img.onload = () => {
                isCropped = true; 
                draw(true);
            };
            img.src = canvas.toDataURL('image/jpeg', 1.0); 
            
            src.delete(); dst.delete(); M.delete(); srcMat.delete(); dstMat.delete();
            
            addPageBtn.disabled = false;
            cropBtn.disabled = true; 
        });

        brightnessSlider.addEventListener('input', () => draw(true));
        contrastSlider.addEventListener('input', () => draw(true));

        bwBtn.addEventListener('click', () => {
            isBlackAndWhite = !isBlackAndWhite;
            draw(true);
            bwBtn.classList.toggle('btn-outline');
            bwBtn.classList.toggle('btn-crop'); 
        });

        function resetFilters() {
            brightnessSlider.value = 0;
            contrastSlider.value = 0;
            bwBtn.className = 'btn-outline';
        }

        resetBtn.addEventListener('click', () => {
            if(originalImageSrc) {
                loadImageData(originalImageSrc);
            }
        });

        function getFilteredImageDataURL() {
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = canvas.width;
            exportCanvas.height = canvas.height;
            const eCtx = exportCanvas.getContext('2d');
            
            eCtx.fillStyle = '#ffffff';
            eCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
            
            eCtx.filter = ctx.filter = `brightness(${100 + parseInt(brightnessSlider.value)}%) contrast(${100 + parseInt(contrastSlider.value)}%) ${isBlackAndWhite ? 'grayscale(100%)' : ''}`;
            eCtx.drawImage(img, 0, 0, exportCanvas.width, exportCanvas.height);
            return exportCanvas.toDataURL('image/jpeg', 0.9);
        }

        downloadCurrentJpgBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'DocuScan_Page.jpg';
            link.href = getFilteredImageDataURL();
            link.click();
        });
        
        addPageBtn.addEventListener('click', () => {
            if(!isCropped) return;

            if(pdfPages.length === 0) emptyGallery.style.display = 'none';

            const pageDataUrl = getFilteredImageDataURL();
            const pageIndex = pdfPages.length;
            pdfPages.push(pageDataUrl);
            
            pageCountTxt.innerText = pdfPages.length;
            downloadPdfBtn.disabled = false;

            const card = document.createElement('div');
            card.className = 'thumb-card';
            
            const header = document.createElement('div');
            header.className = 'thumb-card-header';
            header.innerHTML = `<span>Page ${pdfPages.length}</span>`;
            
            const thumbImg = document.createElement('img');
            thumbImg.src = pageDataUrl;
            
            card.appendChild(header);
            card.appendChild(thumbImg);
            thumbnailList.appendChild(card);
            
            switchTab('pages');
            setTimeout(() => {
                document.getElementById('tab-pages').scrollTo({
                    top: document.getElementById('tab-pages').scrollHeight,
                    behavior: 'smooth'
                });
            }, 50);
        });

        downloadPdfBtn.addEventListener('click', () => {
            if (pdfPages.length === 0) return;
            const { jsPDF } = window.jspdf;
            
            const docFormat = [210, 297]; 
            const doc = new jsPDF({ format: docFormat, unit: 'mm' });
            
            pdfPages.forEach((pageData, index) => {
                if (index > 0) doc.addPage(docFormat);
                doc.addImage(pageData, 'JPEG', 0, 0, 210, 297);
            });
            
            doc.save('DocuScan_Document.pdf');
        });
    </script>
</body>
</html>
